name: libretunes

services:
  libretunes:
    container_name: libretunes
    # image: registry.mregirouard.com/libretunes/libretunes:latest
    build: .
    ports:
      - "3000:3000"
    environment:
      REDIS_URL: redis://redis:6379
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      LIBRETUNES_AUDIO_PATH: /assets/audio
      LIBRETUNES_IMAGE_PATH: /assets/images
    volumes:
      - libretunes-audio:/assets/audio
      - libretunes-images:/assets/images
    depends_on:
      - redis
      - postgres
    restart: always

  redis:
    container_name: redis
    image: redis:latest
    volumes:
      - libretunes-redis:/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
  
  postgres:
    container_name: postgres
    image: postgres:latest
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - libretunes-postgres:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  libretunes-audio:
  libretunes-images:
  libretunes-redis:
  libretunes-postgres:
